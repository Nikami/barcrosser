<bc-header></bc-header>

<section class="home-page" style="padding: 20px;">
  <h1>Stored Forum Posts</h1>

  <div style="margin-bottom: 20px;">
    <button mat-raised-button color="warn" (click)="clearDB()">Clear Database</button>
  </div>

  <mat-card>
    <mat-card-content>
      <pre style="white-space: pre-wrap; word-break: break-all;">{{ posts() | json }}</pre>
    </mat-card-content>
  </mat-card>

</section>

<bc-footer></bc-footer>
